services:
  desktop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "6080:6080"   # noVNC (browser)
      - "5901:5901"   # VNC
      - "8765:8765"   # Aulinx WebSocket
    environment:
      - DISPLAY=:1
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aulinx-home:/home/aulinx
    shm_size: "256m"

volumes:
  aulinx-home:
