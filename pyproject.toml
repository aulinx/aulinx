[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aulinx"
version = "0.2.0"
description = "The AI-native Linux desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zhijie Wong", email = "wang.zhijie@163.com" },
]
keywords = ["ai", "linux", "desktop", "wayland", "llm", "atspi", "agent", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx",
    "rich",
    "prompt_toolkit",
    "websockets",
]

# pyatspi is Linux-only, installed via system package manager:
# apt install python3-pyatspi (Debian/Ubuntu)
# dnf install python3-pyatspi2 (Fedora)

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.urls]
Homepage = "https://aulinx.com"
Repository = "https://github.com/aulinx/aulinx"
Issues = "https://github.com/aulinx/aulinx/issues"
Changelog = "https://github.com/aulinx/aulinx/blob/main/CHANGELOG.md"

[project.scripts]
aulinx = "aulinx.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
